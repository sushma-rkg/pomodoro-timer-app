<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="art-wrap">
      <div class="art fuzzy" id="art" role="img" aria-label="Artwork placeholder"></div>
      <div class="art loading" id="loading" hidden><span>Loading artwork...</span></div>
      <img class="painting fuzzy" id="painting" alt="Painting" hidden>
    </div>
    <div class="side">
      <div class="timer" id="timer">00:30</div>
      <div id="details-slot" aria-live="polite"></div>
      <div id="message-slot" aria-live="polite"></div>
      <div class="buttons">
        <button class="pill" id="main-button" type="button">Start</button>
        <button class="pill soft" id="reset-button" type="button">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
