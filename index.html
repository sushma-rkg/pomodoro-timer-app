<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="art-wrap">
      <div class="art blurred" role="img" aria-label="Artwork placeholder"></div>
    </div>
    <div class="side">
      <div class="timer">25:00</div>
      <div class="buttons">
        <button class="pill" type="button">Start</button>
        <button class="pill soft" type="button">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
